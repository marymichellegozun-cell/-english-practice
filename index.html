<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

:root{
--bg:#f7f8fc;
--card:#ffffff;
--text:#1f2937;
--muted:#6b7280;
--line:#e5e7eb;
--accent:#4f46e5;
--soft:#eef2ff;
--green:#dcfce7;
--red:#fee2e2;
}

*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:var(--bg);
color:var(--text);
}

.app{
max-width:720px;
margin:auto;
padding:18px 14px 110px;
}

h1{
font-size:27px;
margin:0;
}

.subtitle{
font-size:13px;
color:var(--muted);
margin-top:5px;
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:20px;
padding:17px;
margin:13px 0;
}

h2{
margin:0 0 10px;
font-size:20px;
}

h3{
margin:0 0 8px;
}

.small{
font-size:13px;
color:var(--muted);
line-height:1.5;
}

.prompt{
font-size:18px;
font-weight:700;
line-height:1.45;
}

button{
border:0;
border-radius:14px;
padding:12px 15px;
font-size:15px;
font-weight:700;
margin:3px 2px;
}

.primary{
background:var(--accent);
color:white;
}

.secondary{
background:var(--soft);
color:var(--accent);
}

.ghost{
background:white;
border:1px solid var(--line);
color:var(--text);
}

textarea,
select,
input{
font:inherit;
}

textarea,
select{
width:100%;
border:1px solid var(--line);
border-radius:14px;
padding:12px;
font-size:16px;
margin-top:10px;
background:white;
}

textarea{
min-height:110px;
}

.hidden{
display:none!important;
}

.result{
margin-top:12px;
padding:13px;
border-radius:14px;
background:#f3f4f6;
line-height:1.5;
}

.correct{
background:var(--green)!important;
}

.wrong{
background:var(--red)!important;
}

.choice{
width:100%;
display:block;
text-align:left;
background:white;
border:1px solid var(--line);
margin:7px 0;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:14px;
}
